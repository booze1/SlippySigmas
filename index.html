<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#12101A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
    <title>Slippy Sigmas — Phase 1 Feel Test</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="phone">
        <header id="statusbar"></header>
        <section id="enemyfield"></section>
        <section id="slots"></section>
        <section id="tray-wrap">
          <div id="tray"></div>
          <div id="inspector"></div>
        </section>
        <section id="slipbar"></section>
        <button id="resolve">R E S O L V E</button>
        <details id="logwrap">
          <summary>combat log</summary>
          <div id="logpane"></div>
        </details>
      </main>

      <details class="debug" id="debugwrap">
        <summary>Feel-test controls — swap bag, loadout &amp; enemy</summary>
        <div id="debug"></div>
      </details>
    </div>

    <div id="drag-ghost" aria-hidden="true"></div>
    <div id="banner" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
